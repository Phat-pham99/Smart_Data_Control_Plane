name: Checks and Delivery

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.3"
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: Lint and Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --python "$PYTHON_VERSION" --extra dev
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: bash -n docker/entrypoint.sh && sh -n docker/minio-init.sh
      - run: docker compose config --quiet
      - name: Validate workflow syntax
        run: |
          curl --fail --location --silent --show-error https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz | tar -xz -C /tmp actionlint
          /tmp/actionlint -shellcheck= -pyflakes= .github/workflows/checks.yml
      - run: uv run --frozen pytest -m 'not integration' --junitxml=unit-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-results
          path: unit-results.xml

  dependencies:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --python "$PYTHON_VERSION" --extra dev
      - run: uv export --frozen --no-dev --no-emit-project --no-hashes --output-file /tmp/runtime-requirements.txt
      - run: uv run --frozen pip-audit --disable-pip --no-deps --progress-spinner off -r /tmp/runtime-requirements.txt

  integration:
    name: Real Services and Container
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: lifecycle-ci
      POSTGRES_PORT: "55432"
      REDIS_PORT: "56379"
      MINIO_PORT: "59000"
      MINIO_CONSOLE_PORT: "59001"
      API_PORT: "58000"
      DATABASE_URL: postgresql+psycopg://lifecycle:lifecycle@localhost:55432/lifecycle
      REDIS_URL: redis://localhost:56379/0
      S3_ENDPOINT_URL: http://localhost:59000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:59000
      AWS_ACCESS_KEY_ID: lifecycle-app
      AWS_SECRET_ACCESS_KEY: local-app-password
      RUN_INTEGRATION: "1"
      API_BASE_URL: http://localhost:58000
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --python "$PYTHON_VERSION" --extra dev
      - name: Start real dependencies
        run: |
          docker compose up -d --build --wait postgres redis minio
          docker compose build minio-init
          docker compose run --rm --no-deps minio-init
      - name: Check migration upgrade and downgrade
        run: |
          uv run --frozen alembic upgrade head
          uv run --frozen alembic downgrade base
          uv run --frozen alembic upgrade head
          uv run --frozen alembic check
      - name: Run complete suite without integration skips
        run: uv run --frozen pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=75 --junitxml=integration-results.xml
      - name: Build and boot production application image
        run: |
          docker compose up -d --build --wait api
          curl --fail --retry 3 --retry-connrefused http://localhost:58000/health/ready
      - name: Verify database and object persistence across restart
        run: |
          uv run --frozen python scripts/verify_restart.py seed
          docker compose restart postgres minio
          docker compose up -d --wait postgres minio api
          uv run --frozen python scripts/verify_restart.py verify
      - name: Scan application image
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: lifecycle-ci-api:latest
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          scanners: vuln
          severity: HIGH,CRITICAL
      - name: Export verified image for promotion
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save lifecycle-ci-api:latest | gzip > /tmp/verified-image.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: verified-image
          path: /tmp/verified-image.tar.gz
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-evidence
          path: |
            integration-results.xml
            coverage.xml
      - name: Show service diagnostics on failure
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Clean isolated CI resources
        if: always()
        run: docker compose down --volumes --remove-orphans

  publish:
    name: Publish Verified Image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, dependencies, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-image
          path: /tmp/verified-image
      - run: docker load --input /tmp/verified-image/verified-image.tar.gz
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Promote tested image without rebuilding
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          REVISION: ${{ github.sha }}
        run: |
          docker tag lifecycle-ci-api:latest "$IMAGE:sha-$REVISION"
          docker tag lifecycle-ci-api:latest "$IMAGE:latest"
          docker push "$IMAGE:sha-$REVISION"
          docker push "$IMAGE:latest"