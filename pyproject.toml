[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "data-lifecycle-gateway"
version = "0.1.0"
description = "Explainable Data Lifecycle Control Plane for S3 object lifecycle management."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Pham Hong Phat" }]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "sqlalchemy>=2.0.35,<2.1",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "redis>=5.1,<6.0",
    "celery>=5.4,<6.0",
    "boto3>=1.35,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10.0",
    "pytest-cov>=6.0,<7.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.7,<1.0",
    "pip-audit>=2.9,<3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]

[tool.ruff.format]
exclude = ["PLAN.md"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: requires the isolated PostgreSQL, Redis, and MinIO stack"]
